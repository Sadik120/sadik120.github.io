<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
<title id="t">Two-stage facility layout pipeline</title>
<desc id="d">Stage 1: a genetic algorithm generates feasible layouts. Stage 2: a Rainbow DQN agent with a pre-trained graph neural network encoder refines them using a 12-component reward and action masking, producing an optimized layout for a 26-machine facility.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52666e"/></marker>
</defs>
<style>
text{font-family:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;fill:#1d2b31}
.h{font-weight:700;font-size:22px;fill:#fff}
.s{font-size:16px;fill:#dcebee}
.b{font-size:16px}
.k{font-weight:700;font-size:13px;letter-spacing:2px;fill:#0f7c8c}
.ln{stroke:#52666e;stroke-width:2.5;fill:none}
</style>
<rect width="800" height="560" fill="#ffffff"/>
<!-- input -->
<text x="400" y="34" text-anchor="middle" class="k">INPUT</text>
<rect x="210" y="46" width="380" height="58" rx="8" fill="#eaf2f3" stroke="#dbe5e8"/>
<text x="400" y="72" text-anchor="middle" class="b">Machines, sizes, safety space</text>
<text x="400" y="93" text-anchor="middle" class="b">and material-flow matrix</text>
<path class="ln" d="M400 104V134" marker-end="url(#a)"/>
<!-- stage 1 -->
<text x="60" y="160" class="k">STAGE 1</text>
<rect x="60" y="170" width="680" height="96" rx="10" fill="#0f7c8c"/>
<text x="400" y="208" text-anchor="middle" class="h">Genetic algorithm</text>
<text x="400" y="236" text-anchor="middle" class="s">Generates a population of feasible initial layouts</text>
<path class="ln" d="M400 266V296" marker-end="url(#a)"/>
<!-- stage 2 -->
<text x="60" y="322" class="k">STAGE 2</text>
<rect x="60" y="332" width="680" height="128" rx="10" fill="#06384b"/>
<text x="400" y="370" text-anchor="middle" class="h">Rainbow DQN agent refines the layout</text>
<rect x="88" y="390" width="196" height="50" rx="6" fill="#0b4a60"/>
<text x="186" y="420" text-anchor="middle" class="s">Pre-trained GNN encoder</text>
<rect x="302" y="390" width="196" height="50" rx="6" fill="#0b4a60"/>
<text x="400" y="420" text-anchor="middle" class="s">12-component reward</text>
<rect x="516" y="390" width="196" height="50" rx="6" fill="#0b4a60"/>
<text x="614" y="420" text-anchor="middle" class="s">Action masking, no overlap</text>
<path class="ln" d="M400 460V490" marker-end="url(#a)"/>
<!-- output -->
<rect x="210" y="496" width="380" height="50" rx="8" fill="#eaf2f3" stroke="#dbe5e8"/>
<text x="400" y="527" text-anchor="middle" class="b" font-weight="700">Optimized layout · 26-machine case</text>
</svg>
