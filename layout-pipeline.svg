<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#f3f7f8"/>
  <text x="40" y="58" font-size="24" font-weight="700" fill="#06384b">Two-stage facility layout pipeline</text>
  <text x="40" y="88" font-size="16" fill="#3f5a64">M.Engg. thesis, BUET · 26-machine industrial layout</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#06384b"/></marker></defs>
  <!-- stage 1 -->
  <rect x="40" y="150" width="250" height="170" rx="10" fill="#ffffff" stroke="#06384b" stroke-width="2"/>
  <text x="60" y="185" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">STAGE 1</text>
  <text x="60" y="215" font-size="20" font-weight="700" fill="#06384b">Genetic algorithm</text>
  <text x="60" y="245" font-size="15" fill="#3f5a64">Generates feasible</text>
  <text x="60" y="267" font-size="15" fill="#3f5a64">starting layouts on</text>
  <text x="60" y="289" font-size="15" fill="#3f5a64">a 9, 11 or 13 grid</text>
  <!-- stage 2 -->
  <rect x="355" y="150" width="270" height="170" rx="10" fill="#06384b"/>
  <text x="375" y="185" font-size="13" font-weight="700" fill="#8fd3dc" letter-spacing="1.5">STAGE 2</text>
  <text x="375" y="215" font-size="20" font-weight="700" fill="#ffffff">Rainbow DQN agent</text>
  <text x="375" y="245" font-size="15" fill="#d6e7ea">Refines the layout with</text>
  <text x="375" y="267" font-size="15" fill="#d6e7ea">action masking and a</text>
  <text x="375" y="289" font-size="15" fill="#d6e7ea">12-part composite reward</text>
  <!-- output -->
  <rect x="690" y="150" width="230" height="170" rx="10" fill="#ffffff" stroke="#06384b" stroke-width="2"/>
  <text x="710" y="185" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">OUTPUT</text>
  <text x="710" y="215" font-size="20" font-weight="700" fill="#06384b">Facility layout</text>
  <g fill="#0f7c8c" opacity=".85">
    <rect x="712" y="238" width="40" height="28"/><rect x="758" y="238" width="58" height="28"/><rect x="822" y="238" width="30" height="28"/><rect x="858" y="238" width="40" height="28"/>
    <rect x="712" y="272" width="62" height="30"/><rect x="780" y="272" width="34" height="30"/><rect x="820" y="272" width="78" height="30"/>
  </g>
  <line x1="290" y1="235" x2="352" y2="235" stroke="#06384b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="625" y1="235" x2="687" y2="235" stroke="#06384b" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- GNN -->
  <rect x="355" y="400" width="270" height="140" rx="10" fill="#ffffff" stroke="#0f7c8c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="375" y="435" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">STATE ENCODER</text>
  <text x="375" y="465" font-size="20" font-weight="700" fill="#06384b">Graph neural network</text>
  <text x="375" y="495" font-size="15" fill="#3f5a64">Pre-trained on synthetic</text>
  <text x="375" y="517" font-size="15" fill="#3f5a64">material-flow graphs</text>
  <line x1="490" y1="400" x2="490" y2="324" stroke="#0f7c8c" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- constraints -->
  <text x="40" y="420" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">CONSTRAINTS</text>
  <text x="40" y="450" font-size="15" fill="#3f5a64">Machine dimensions</text>
  <text x="40" y="474" font-size="15" fill="#3f5a64">Multi-cell overlap prevention</text>
  <text x="40" y="498" font-size="15" fill="#3f5a64">Flow between machines</text>
  <text x="690" y="420" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">TESTED ON</text>
  <text x="690" y="450" font-size="15" fill="#3f5a64">21-run reward-weight design</text>
  <text x="690" y="474" font-size="15" fill="#3f5a64">3 grid resolutions</text>
  <text x="690" y="498" font-size="15" fill="#3f5a64">6 flow configurations</text>
</svg>
