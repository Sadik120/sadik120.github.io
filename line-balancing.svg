    <text x="375" y="255" font-size="15" fill="#d6e7ea">Operations regrouped by</text>
    <text x="375" y="277" font-size="15" fill="#d6e7ea">ranked positional weight</text>
    <rect x="670" y="160" width="250" height="150" rx="10" fill="#ffffff" stroke="#06384b" stroke-width="2"/>
    <text x="690" y="195" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">STEP 3</text>
    <text x="690" y="225" font-size="20" font-weight="700" fill="#06384b">Tecnomatix model</text>
    <text x="690" y="255" font-size="15" fill="#3f5a64">Balanced line simulated</text>
    <text x="690" y="277" font-size="15" fill="#3f5a64">to check feasibility</text>
    <line x1="290" y1="235" x2="352" y2="235" stroke="#06384b" stroke-width="2.5" marker-end="url(#a)"/>
