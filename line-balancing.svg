<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#f3f7f8"/>
  <text x="40" y="58" font-size="24" font-weight="700" fill="#06384b">Sewing line balancing</text>
  <text x="40" y="88" font-size="16" fill="#3f5a64">B.Sc. thesis, KUET · published 2019</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#06384b"/></marker></defs>
  <g>
    <rect x="40" y="160" width="250" height="150" rx="10" fill="#ffffff" stroke="#06384b" stroke-width="2"/>
    <text x="60" y="195" font-size="13" font-weight="700" fill="#0f7c8c" letter-spacing="1.5">STEP 1</text>
    <text x="60" y="225" font-size="20" font-weight="700" fill="#06384b">Time study</text>
    <text x="60" y="255" font-size="15" fill="#3f5a64">Every operation on the</text>
    <text x="60" y="277" font-size="15" fill="#3f5a64">bag-making line timed</text>
